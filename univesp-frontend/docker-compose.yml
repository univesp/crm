name: univesp-frontend-local

services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    environment:
      SHELL: /bin/bash
    working_dir: /home/frappe
    volumes:
      - ../docker:/workspace
    ports:
      - "8000:8000"
      - "9000:9000"

  univesp-frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 8080"
    depends_on:
      - frappe
    environment:
      VITE_APP_NAME: UNIVESP Atendimento
      VITE_APP_BASE: /crm/
      VITE_ROUTER_BASE: /crm/
      VITE_DEV_HOST: 0.0.0.0
      VITE_DEV_PORT: 8080
      VITE_PREVIEW_HOST: 0.0.0.0
      VITE_PREVIEW_PORT: 8080
      VITE_ENABLE_MOCKS: "false"
      VITE_ENABLE_ANALYTICS_MOCKS: "false"
      VITE_FRAPPE_BASE_URL: ""
      VITE_FRAPPE_API_PREFIX: /api
      VITE_FRAPPE_AUTH_MODE: token
      VITE_FRAPPE_API_KEY: ${FRAPPE_API_KEY}
      VITE_FRAPPE_API_SECRET: ${FRAPPE_API_SECRET}
      VITE_FRAPPE_PROXY_TARGET: http://frappe:8000
      VITE_FRAPPE_SOCKETIO_TARGET: http://frappe:9000
      VITE_FRAPPE_TICKET_DOCTYPE: Issue
      VITE_AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
      VITE_AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
      VITE_AZURE_REDIRECT_URI: http://localhost:8080/crm/login
      VITE_DEFAULT_AUTH_ROUTE: /
      VITE_SSO_DEV_BYPASS: "true"
      VITE_SSO_DEV_BYPASS_EMAIL: ${VITE_SSO_DEV_BYPASS_EMAIL:-admin@univesp.br}
      VITE_SSO_DEV_BYPASS_NAME: ${VITE_SSO_DEV_BYPASS_NAME:-Administrador Local}
      VITE_SAML_ENTITY_ID: crm_development
      VITE_SAML_NAME_ID_FORMAT: urn:oasis:names:tc:SAML:2.0:nameid-format:email
      VITE_SAML_NAME_ID_ATTRIBUTE: mail
      VITE_SAML_ACS_URL: http://localhost:8080/consume
      VITE_SAML_LOGOUT_URL: http://localhost:8080/logout
      VITE_SAML_IDP_METADATA_URL: https://login.univesp.br/simplesaml/saml2/idp/metadata.php
      VITE_HANDOFF_WEBHOOK_URL: https://contact-center.example.com/handoff
    ports:
      - "8080:8080"
    tty: true
    volumes:
      - .:/app
      - frontend-node-modules:/app/node_modules

volumes:
  mariadb-data:
  frontend-node-modules:
