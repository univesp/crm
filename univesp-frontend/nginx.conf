server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  proxy_http_version 1.1;
  proxy_ssl_server_name on;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # SSO gateway routes must stay ahead of the generic Frappe /api/ proxy.
  location = /api/me {
    proxy_pass ${SSO_GATEWAY_ORIGIN};
  }

  location ^~ /api/sso/ {
    proxy_pass ${SSO_GATEWAY_ORIGIN};
  }

  # The Azure implicit-flow callback is handled by the Vue app.
  location = /api/sso/azure/callback {
    try_files /index.html =404;
  }

  # Frappe API routes used by both the native CRM and UNIVESP frontend.
  location ^~ /api/method/ {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  location ^~ /api/resource/ {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  location ^~ /api/ {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  # Native Frappe CRM and Desk remain behind the frontend entrypoint.
  location = /crm {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  location ^~ /crm/ {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  location ^~ /app/ {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  location ^~ /desk/ {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  location ^~ /printview/ {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  location ^~ /oauth/ {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  location ^~ /consume/ {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  location = /consume {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  location = /logout {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  # Frappe static and uploaded files.
  location ^~ /assets/ {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  location ^~ /files/ {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  location ^~ /private/files/ {
    proxy_pass ${FRAPPE_WEB_ORIGIN};
  }

  location ^~ /socket.io/ {
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass ${FRAPPE_SOCKETIO_ORIGIN};
  }

  # UNIVESP frontend routes.
  location = /login {
    try_files /index.html =404;
  }

  location ^~ /univesp-assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
