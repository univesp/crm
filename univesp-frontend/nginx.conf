server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  proxy_http_version 1.1;
  proxy_ssl_server_name on;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location = /healthz {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # SSO gateway routes must stay ahead of the generic Frappe /api/ proxy.
  location = /api/me {
    proxy_pass ${SSO_GATEWAY_ORIGIN};
  }

  location ^~ /api/sso/ {
    proxy_pass ${SSO_GATEWAY_ORIGIN};
  }

  location ^~ /api/app/v1/ {
    proxy_pass ${SSO_GATEWAY_ORIGIN};
  }

  location ^~ /api/public/v1/ {
    proxy_pass ${SSO_GATEWAY_ORIGIN};
  }

  # Frappe is internal; browser traffic must go through the BFF.
  location ^~ /api/method/ { return 404; }
  location ^~ /api/resource/ { return 404; }
  location ^~ /api/ { return 404; }

  # Native Frappe CRM and Desk remain behind the frontend entrypoint.
  location = /crm {
    return 302 /;
  }

  location ^~ /crm/ {
    return 302 /;
  }

  location ^~ /app/ { return 404; }
  location ^~ /desk/ { return 404; }
  location ^~ /printview/ { return 404; }
  location ^~ /oauth/ { return 404; }
  location = /consume { return 404; }
  location ^~ /consume/ { return 404; }
  location = /logout { return 404; }
  location ^~ /assets/ { return 404; }
  location ^~ /files/ { return 404; }
  location ^~ /private/files/ { return 404; }
  location ^~ /socket.io/ { return 404; }

  # UNIVESP frontend routes.
  location = /login {
    try_files /index.html =404;
  }

  location ^~ /univesp-assets/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
