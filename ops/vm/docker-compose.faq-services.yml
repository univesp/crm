services:
  antimalware:
    build:
      context: ../antimalware
    restart: unless-stopped
    environment:
      ANTIMALWARE_TOKEN: ${ANTIMALWARE_TOKEN}
      MAX_SCAN_BYTES: '10485760'
      SCAN_TIMEOUT_SECONDS: '15'
    ports:
      - '127.0.0.1:${ANTIMALWARE_PORT:-18081}:8080'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 10s
      timeout: 4s
      retries: 12

  media-processor:
    build:
      context: ../media-processor
    restart: unless-stopped
    environment:
      MEDIA_PROCESSOR_TOKEN: ${MEDIA_PROCESSOR_TOKEN}
    ports:
      - '127.0.0.1:${MEDIA_PROCESSOR_PORT:-18082}:8080'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)",
        ]
      interval: 10s
      timeout: 4s
      retries: 12
