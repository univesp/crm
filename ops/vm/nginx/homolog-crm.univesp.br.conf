upstream univesp_sso_gateway {
	server 127.0.0.1:4000 fail_timeout=0;
}

upstream frappe_web {
	server 127.0.0.1:8000 fail_timeout=0;
}

upstream frappe_socketio {
	server 127.0.0.1:9000 fail_timeout=0;
}

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	listen 80;
	server_name homolog-crm.univesp.br;

	root /var/crm/univesp-frontend/dist;
	index index.html;

	client_max_body_size 50m;
	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;

	location = /healthz {
		add_header Content-Type text/plain;
		return 200 'ok';
	}

	location = /api/sso/azure/callback {
		try_files /index.html =404;
	}

	location = /api/me {
		proxy_pass http://univesp_sso_gateway;
	}

	location ^~ /api/sso/ {
		proxy_pass http://univesp_sso_gateway;
	}

	location ^~ /api/method/ {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location ^~ /api/resource/ {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location ^~ /api/ {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location = /crm {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location ^~ /crm/ {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location ^~ /app/ {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location ^~ /desk/ {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location ^~ /printview/ {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location ^~ /oauth/ {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location = /consume {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location ^~ /consume/ {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location = /logout {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location ^~ /assets/ {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location ^~ /files/ {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location ^~ /private/files/ {
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_web;
	}

	location ^~ /socket.io/ {
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header X-Frappe-Site-Name crm.localhost;
		proxy_pass http://frappe_socketio;
	}

	location = /login {
		try_files /index.html =404;
	}

	location ^~ /univesp-assets/ {
		access_log off;
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
