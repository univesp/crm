upstream univesp_sso_gateway {
	server 127.0.0.1:4000 fail_timeout=0;
}

upstream frappe_web {
	server 127.0.0.1:8000 fail_timeout=0;
}

upstream frappe_socketio {
	server 127.0.0.1:9000 fail_timeout=0;
}

map $http_upgrade $connection_upgrade {
	default upgrade;
	'' close;
}

server {
	listen 80;
	listen 443 ssl;
	ssl_certificate /etc/letsencrypt/live/homolog-crm.univesp.br/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/homolog-crm.univesp.br/privkey.pem;
	server_name homolog-crm.univesp.br;

	root /var/crm/univesp-frontend/dist;
	index index.html;

	client_max_body_size 50m;
	proxy_buffer_size 128k;
	proxy_buffers 4 256k;
	proxy_busy_buffers_size 256k;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host $host;
	add_header X-Content-Type-Options nosniff always;
	add_header X-Frame-Options SAMEORIGIN always;
	add_header Referrer-Policy strict-origin-when-cross-origin always;
	add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

	location = /healthz {
		add_header Content-Type text/plain;
		return 200 'ok';
	}

	location = /api/me {
		proxy_pass http://univesp_sso_gateway;
	}

	location ^~ /api/sso/ {
		proxy_pass http://univesp_sso_gateway;
	}

	location ^~ /api/app/v1/ {
		proxy_pass http://univesp_sso_gateway;
	}

	# Frappe e um motor interno. Somente o gateway pode acessar seus metodos.
	location ^~ /api/method/ { return 404; }
	location ^~ /api/resource/ {
		return 404;
	}
	location ^~ /api/ { return 404; }

	location = /crm {
		return 302 /;
	}

	location ^~ /crm/ {
		return 302 /;
	}

	location = /app { return 404; }
	location ^~ /app/ { return 404; }
	location = /desk { return 404; }
	location = /printview { return 404; }
	location = /oauth { return 404; }
	location = /assets { return 404; }
	location = /files { return 404; }
	location = /private/files { return 404; }
	location = /socket.io { return 404; }
	location ^~ /desk/ { return 404; }
	location ^~ /printview/ { return 404; }
	location ^~ /oauth/ { return 404; }
	location = /consume { return 404; }
	location ^~ /consume/ { return 404; }
	location = /logout { return 404; }
	location ^~ /assets/ { return 404; }
	location ^~ /files/ { return 404; }
	location ^~ /private/files/ { return 404; }
	location ^~ /socket.io/ { return 404; }

	location = /login {
		try_files /index.html =404;
	}

	location ^~ /univesp-assets/ {
		access_log off;
		expires 1y;
		add_header Cache-Control "public, immutable";
		try_files $uri =404;
	}

	location / {
		try_files $uri $uri/ /index.html;
	}
}
