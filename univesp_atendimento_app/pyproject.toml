[project]
name = "univesp_atendimento"
authors = [{ name = "UNIVESP" }]
description = "Backend institucional do Atendimento UNIVESP"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.109.0,<17.0.0"
helpdesk = ">=0.0.1,<1.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
